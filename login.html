<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopy | Login</title>
    <link rel="stylesheet" href="main.css">
</head>
<body class="auth-page">
    <nav class="navbar" style="position: absolute; width: 100%; top: 0; border: none; background: transparent; backdrop-filter: none;">
        <a href="/" class="logo">
            <span class="logo-dot"></span> Loopy
        </a>
    </nav>
    
    <div class="auth-card">
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Log in to manage your feedback campaigns.</p>
        </div>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Log In</button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="/signup.html">Sign up for free</a>
        </div>
    </div>
</body>
</html>
