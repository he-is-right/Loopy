<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopy | Sign Up</title>
    <link rel="stylesheet" href="main.css">
</head>
<body class="auth-page">
    <nav class="navbar" style="position: absolute; width: 100%; top: 0; border: none; background: transparent; backdrop-filter: none;">
        <a href="/" class="logo">
            <span class="logo-dot"></span> Loopy
        </a>
    </nav>
    
    <div class="auth-card">
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Start collecting better feedback today.</p>
        </div>
        
        <form action="/signup" method="POST">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="Jane" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" name="email" placeholder="jane@company.com" autocomplete="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" autocomplete="new-password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Create Account</button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="/login.html">Log in</a>
        </div>
    </div>
</body>
</html>
