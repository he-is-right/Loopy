<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopy | Sign Up</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <nav class="top-nav">
        <a href="/">&#8592; Home</a>
    </nav>
    <div class="form-container">
        <h1>Create Account</h1>
        <form action="/signup" method="POST">
            <div class="input-row">
                <div class="input-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="e.g. Jane" required>
                </div>
                <div class="input-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="e.g. Doe" required>
                </div>
            </div>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" autocomplete="new-password" required>
            </div>
            <button type="submit" class="submit-btn">Sign Up</button>
        </form>
        <div class="form-footer">
            Already have an account? <a href="/login.html">Log in</a>
        </div>
    </div>
</body>
</html>
