<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback</title>
    <link rel="stylesheet" href="/main.css">
</head>
<body class="public-feedback-page" id="pageBody">

    <div class="feedback-glass-card" id="feedbackFormContainer">
        <h1 id="campaignTitle" class="feedback-title">Loading...</h1>
        
        <form id="feedbackForm" style="display: none;">
            <div class="feedback-question-block">
                <label id="labelQ1"></label>
                <div class="rating-group" id="ratingContainer">
                    <input type="radio" name="rating" id="star5" value="5"><label for="star5">★</label>
                    <input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label>
                    <input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label>
                    <input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label>
                    <input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label>
                </div>
            </div>
            
            <div class="feedback-question-block">
                <label id="labelQ2"></label>
                <textarea id="textResponse" class="feedback-textarea" required placeholder="Type your response here..."></textarea>
            </div>
            
            <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="padding: 18px; font-size: 1.1rem; border-radius: var(--radius-lg);">Submit Feedback</button>
        </form>
        
        <div id="successMessage" class="success-state" style="display: none;">
            <div class="success-icon">✓</div>
            <h2>Thank you!</h2>
            <p>Your feedback has been successfully submitted.</p>
        </div>
    </div>

    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initFeedbackPage();
        });
    </script>
</body>
</html>
